  <script>
  (() => {
    const root = document.getElementById('holo-pack-opening');

    const config = JSON.parse(root.querySelector('.pack-configuration').textContent);
    const $ = selector => root.querySelector(selector);
    const NS = 'http://www.w3.org/2000/svg';
    const stage = $('.holo-stage'), zone = $('.pack-zone'), floating = $('.pack-float'), shaker = $('.pack-shake'), tilt = $('.pack-tilt'), pack = $('.pack-body');

    const tray = $('.cards-tray'), action = $('.open-action'), status = $('.status-line'), pityLine = $('.pity-line'), summary = $('.result-summary');
    const picker = $('.pack-picker'), soundToggle = $('.sound-toggle'), ratesToggle = $('.rates-toggle'), ratesPanel = $('.rates-panel');
    const canvas = $('.confetti'), context = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const speed = Number.isFinite(config.speed) ? Math.max(.5, Math.min(2, config.speed)) : 1;
    const ms = value => reduced.matches ? Math.min(80, value / speed) : value / speed;
    const rand = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; } catch { return Math.random(); } };

    /* ---------- 文案、存储 ---------- */
    const ORDER = ['common', 'rare', 'epic', 'legendary'];
    const rank = rarity => ORDER.indexOf(rarity);
    const rarityNames = { common: 'COMMON', rare: 'RARE', epic: 'EPIC', legendary: 'LEGENDARY', ...(config.rarityNames || {}) };
    const labels = {
      hint: '向右滑动，撕开卡包',
      packAria: '卡包。按住向右滑动撕开，也可以按右方向键',
      nudge: '点一下撕不开哦，按住向右滑动试试',
      keyNudge: '按右方向键 → 就能撕开',
      sealed: '{count} 张小小惊喜，等你拆开',
      tearing: '继续向右，快撕开了',
      opening: '撕开一点，快乐多一点',
      revealed: '{count} 张小小惊喜，全部收好',
      best: '出现了 {rarity} · {name}！',
      selected: '{name} · {rarity}',
      again: '再开一包',
      rates: '概率',
      ratesTitle: '概率公示',
      ratesNote: '每张卡独立抽取，以上为单张概率；保底会提高实际出率。',
      guarantee: '每包至少 1 张 {rarity} 或更高',
      pity: '连续 {packs} 包内必出 {rarity}',
      pityLeft: '距离 {rarity} 保底还有 {left} 包',
      sound: '音效',
      colors: '卡包颜色',
      summary: '本包卡片：{names}。',
      ...(config.labels || {})
    };
    const L = (key, vars = {}) => String(labels[key] ?? '').replace(/\{(\w+)\}/g, (match, name) => name in vars ? vars[name] : match);
    const store = {
      get(key, fallback) { try { const value = localStorage.getItem(key); return value === null ? fallback : JSON.parse(value); } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
    };
    const storeKey = `holo-pack:${config.title || ''}:${config.series || ''}`;
    const say = text => { if (status.textContent !== text) status.textContent = text; };

    /* ---------- 卡池与抽卡规则 ---------- */
    const pool = (Array.isArray(config.cards) ? config.cards : []).map((card, index) => ({ ...card, index, rarity: ORDER.includes(card.rarity) ? card.rarity : 'common' }));
    const random = config.mode === 'random' && pool.length > 0;
    const packSize = random ? Math.max(1, Math.min(10, Math.round(Number(config.packSize) || 5))) : pool.length;
    const byRarity = Object.fromEntries(ORDER.map(r => [r, pool.filter(card => card.rarity === r)]));
    const rates = Object.fromEntries(ORDER.map(r => { const value = Number(config.rates?.[r]); return [r, byRarity[r].length && value > 0 ? value : 0]; }));
    if (random && !ORDER.some(r => rates[r] > 0)) ORDER.forEach(r => { rates[r] = byRarity[r].length; });
    const rateTotal = ORDER.reduce((sum, r) => sum + rates[r], 0) || 1;
    const hasAtLeast = rarity => pool.some(card => rank(card.rarity) >= rank(rarity));
    const guarantee = random && ORDER.includes(config.guarantee) && hasAtLeast(config.guarantee) ? config.guarantee : null;
    const pity = random && config.pity && ORDER.includes(config.pity.rarity) && hasAtLeast(config.pity.rarity) && Number.isInteger(config.pity.packs) && config.pity.packs > 0 ? { rarity: config.pity.rarity, packs: config.pity.packs } : null;
    let pityCount = pity ? Math.max(0, Math.min(pity.packs - 1, Number(store.get(`${storeKey}:pity`, 0)) || 0)) : 0;
    function rollRarity(min = 'common') {
      const options = ORDER.slice(rank(min)).filter(r => byRarity[r].length);
      const total = options.reduce((sum, r) => sum + rates[r], 0);
      if (!total) return options[0];
      let roll = rand() * total;
      for (const r of options) { roll -= rates[r]; if (roll < 0) return r; }
      return options[options.length - 1];
    }
    function drawPack() {
      if (!random) return pool.slice();
      const pickOf = rarity => { const list = byRarity[rarity]; return list[Math.floor(rand() * list.length)]; };
      const list = Array.from({ length: packSize }, () => pickOf(rollRarity()));
      const lowest = () => list.reduce((low, card, i) => rank(card.rarity) < rank(list[low].rarity) ? i : low, 0);
      const ensure = rarity => { if (!list.some(card => rank(card.rarity) >= rank(rarity))) list[lowest()] = pickOf(rollRarity(rarity)); };
      if (guarantee) ensure(guarantee);
      if (pity && pityCount + 1 >= pity.packs) ensure(pity.rarity);
      return list.map((card, i) => [card, i]).sort((a, b) => rank(a[0].rarity) - rank(b[0].rarity) || a[1] - b[1]).map(([card]) => card);
    }
    const bestOf = list => list.reduce((best, card) => rank(card.rarity) > rank(best.rarity) ? card : best, list[0]);

    /* ---------- 音效（WebAudio 合成，无音频文件） ---------- */
    const audio = (() => {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      let ctx = null, out = null, noise = null, muted = false;
      const live = () => !muted && ctx && ctx.state !== 'closed';
      function unlock() {
        if (muted || !AudioCtor) return;
        try {
          if (!ctx) {
            ctx = new AudioCtor(); out = ctx.createGain(); out.gain.value = .5; out.connect(ctx.destination);
            noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
            const data = noise.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          }
          if (ctx.state === 'suspended') ctx.resume();
        } catch { ctx = null; }
      }
      function envelope(gain, t, attack, peak, duration) { gain.gain.setValueAtTime(.0001, t); gain.gain.exponentialRampToValueAtTime(peak, t + attack); gain.gain.exponentialRampToValueAtTime(.0001, t + duration); }

        const source = ctx.createBufferSource(), filter = ctx.createBiquadFilter(), amp = ctx.createGain();
        source.buffer = noise; filter.type = type; filter.Q.value = q; filter.frequency.setValueAtTime(freq, t);
        if (freqTo) filter.frequency.exponentialRampToValueAtTime(freqTo, t + duration);
        envelope(amp, t, Math.min(.004, duration / 4), gain, duration);
        source.connect(filter); filter.connect(amp); amp.connect(out); source.start(t, Math.random() * .8, duration + .05);
      }
      function tone(t, freq, { duration = .3, type = 'sine', gain = .15, to = 0, attack = .005 } = {}) {
        const osc = ctx.createOscillator(), amp = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, t); if (to) osc.frequency.exponentialRampToValueAtTime(to, t + duration);

      }
      return {

      setPackFace(null); if (packEyes) packEyes.style.transform = '';
      enterPack();
      if (hadFocus) pack.focus({ preventScroll: true });
      save();
    }
    action.addEventListener('click', () => { if (state === 'revealed') reset(); });
    colorChoices.forEach(button => button.addEventListener('click', () => {
      if (state === 'opening') return;
      chooseColor(button.dataset.color);
      if (state === 'revealed') reset(); else save();
    }));

    /* ---------- 概率公示、音效开关 ---------- */
    function setRates(open) { ratesPanel.hidden = !open; ratesToggle.setAttribute('aria-expanded', String(open)); }
    if (random) {
      ratesToggle.hidden = false; ratesToggle.textContent = L('rates'); ratesPanel.setAttribute('aria-label', L('ratesTitle'));
      const title = document.createElement('div'); title.className = 'rates-title'; title.textContent = L('ratesTitle');
      const rows = ORDER.filter(r => byRarity[r].length).map(r => {
        const row = document.createElement('div'); row.className = `rate-row rate-${r}`;
        const name = document.createElement('span'); name.textContent = rarityNames[r];
        const value = document.createElement('strong'), pct = rates[r] / rateTotal * 100;
        value.textContent = `${pct > 0 && pct < 1 ? pct.toFixed(2) : pct.toFixed(1)}%`;
        row.append(name, value); return row;
      });
      const notes = [L('ratesNote')];
      if (guarantee) notes.push(L('guarantee', { rarity: rarityNames[guarantee] }));
      if (pity) notes.push(L('pity', { packs: pity.packs, rarity: rarityNames[pity.rarity] }));
      ratesPanel.replaceChildren(title, ...rows, ...notes.map(text => { const p = document.createElement('p'); p.className = 'rate-note'; p.textContent = text; return p; }));
      ratesToggle.addEventListener('click', () => setRates(ratesPanel.hidden));
      root.addEventListener('keydown', event => { if (event.key === 'Escape' && !ratesPanel.hidden) { setRates(false); ratesToggle.focus(); } });
      document.addEventListener('pointerdown', event => { if (!ratesPanel.hidden && !ratesPanel.contains(event.target) && !ratesToggle.contains(event.target)) setRates(false); });
    }
    let soundOn = Boolean(store.get(`${storeKey}:sound`, config.sound !== false));
    function setSound(on) { soundOn = on; soundToggle.setAttribute('aria-pressed', String(on)); audio.setMuted(!on); }
    soundToggle.setAttribute('aria-label', L('sound'));
    soundToggle.addEventListener('click', () => { setSound(!soundOn); store.set(`${storeKey}:sound`, soundOn); if (soundOn) { audio.unlock(); audio.land('rare'); } });

    /* ---------- 宿主状态（ChatGPT / Codex widget） ---------- */
    function save() {
      if (!window.openai?.setWidgetState) return;
      try {
        Promise.resolve(window.openai.setWidgetState({
          modelContent: { cardPack: { phase: state, color: root.dataset.color, cards: (state === 'revealed' && drawn ? drawn : []).map(card => ({ name: card.name, rarity: card.rarity })), selectedCard: selected < 0 || !drawn ? null : drawn[selected].name } },
          privateContent: { color: root.dataset.color, revealed: state === 'revealed', selected, drawn: state === 'revealed' && drawn ? drawn.map(card => card.index) : [] }
        })).catch(() => {});
      } catch {}
    }
    function restore(value) {
      if (!value?.privateContent || state === 'opening') return;
      const saved = value.privateContent; chooseColor(saved.color || root.dataset.color);
      const list = Array.isArray(saved.drawn) ? saved.drawn.map(index => pool[index]).filter(Boolean) : [];
      if (!saved.revealed || !list.length) return;
      ++run; clearAnimations(); drawn = list; front = W; applyTear(); renderCards(list);
      slots.forEach((slot, index) => { slot.style.opacity = '1'; slot.classList.add('landed'); });
      showRevealed();
      selected = Number.isInteger(saved.selected) && saved.selected >= 0 && saved.selected < list.length ? saved.selected : -1;
      cardButtons.forEach((button, index) => { button.classList.toggle('is-selected', index === selected); button.setAttribute('aria-pressed', String(index === selected)); });
    }

    chooseColor(config.packColor); setSound(soundOn); setLayout(packSize); updatePity(); say(sealedText()); measure(); enterPack(); scheduleBlinks();
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals', event => { if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState); });
  })();
  </script>
</div>
